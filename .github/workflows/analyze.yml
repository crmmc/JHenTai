name: Analyze

on:
  push:
    branches:
      - ci/analyze-home-tabs
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
