name: Analyze

on:
  push:
    branches:
      - ci/analyze-home-tabs
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Use debug signing for release build (no keystore on fork)
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          grep -n "signingConfig signingConfigs.debug" android/app/build.gradle

      - name: Build release APK (split per ABI)
        run: flutter build apk -t lib/src/main.dart --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jhentai-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
